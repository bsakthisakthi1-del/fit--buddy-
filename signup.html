<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy | Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<header class="navbar">
    <a href="index.html" class="logo"><span>Fit</span>Buddy</a>
    <a href="index.html" class="back">← Home</a>
</header>

<main class="auth-wrapper">

    <div class="auth-card">

        <div class="auth-icon">🏃</div>

        <h1>Create Account</h1>
        <p>Start your fitness journey today.</p>

        <label>Full Name</label>
        <input type="text" id="signupName" placeholder="Your name">

        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="Your email">

        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="Minimum 6 characters">

        <label>Confirm Password</label>
        <input type="password" id="signupConfirm" placeholder="Confirm password">

        <button class="btn primary full" onclick="signupUser()">
            Create Account
        </button>

        <div id="signupMessage" class="message"></div>

        <p class="auth-link">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</main>

<script src="script.js"></script>
</body>
</html>
