<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Activity | FitBuddy</title><link rel="stylesheet" href="style.css"></head>
<body><div id="toast" class="toast"></div><main class="app">
<header class="topbar">
  <a class="brand" href="index.html">Fit<span>Buddy</span></a>
  <button class="icon-btn" onclick="location.href='profile.html'">◉</button>
</header>
<section class="page">
<div class="hero"><div class="eyebrow">Daily movement</div><h1>Activity</h1><p class="muted">Record steps or any movement you want to remember.</p></div>
<div class="card"><h2>Today’s steps</h2><div class="form-group"><label>Steps</label><input id="stepsInput" type="number" min="0" placeholder="e.g. 5000"></div><button class="btn primary" onclick="saveSteps()">Save activity</button></div>
<div class="section grid grid2"><div class="card"><div class="label">Steps</div><div class="stat" id="activitySteps">0</div></div><div class="card"><div class="label">Goal</div><div class="stat">6000</div></div></div>
</section>

</div>
</main>
