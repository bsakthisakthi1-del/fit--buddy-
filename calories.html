<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy | Calories</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">

    <a href="dashboard.html" class="logo">
        <span>Fit</span>Buddy
    </a>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="bmi.html">BMI</a>
        <a href="workout.html">Workout</a>
    </nav>

</header>

<main class="calculator-page">

    <div class="simple-title">
        <span class="tag">HEALTH TOOL</span>
        <h1>Calorie Calculator</h1>
        <p>Estimate your daily calorie needs.</p>
    </div>


    <div class="calculator-card">

        <label>Age</label>
        <input type="number" id="calAge" placeholder="Example: 21">

        <label>Weight (kg)</label>
        <input type="number" id="calWeight" placeholder="Example: 60">

        <label>Height (cm)</label>
        <input type="number" id="calHeight" placeholder="Example: 170">

        <label>Gender</label>

        <select id="calGender">
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <label>Activity Level</label>

        <select id="activityLevel">
            <option value="1.2">Little exercise</option>
            <option value="1.375">Light exercise</option>
            <option value="1.55">Moderate exercise</option>
            <option value="1.725">Heavy exercise</option>
            <option value="1.9">Very heavy exercise</option>
        </select>

        <button class="btn primary full" onclick="calculateCalories()">
            Calculate Calories
        </button>

        <div id="calorieResult" class="result-box">
            Enter your details.
        </div>

    </div>

</main>

<script src="script.js"></script>
</body>
</html>
